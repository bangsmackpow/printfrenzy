name: Security Scan (Gitleaks, Trivy, Semgrep)

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  security-scan:
    name: Run Vulnerability Checks
    runs-on: ubuntu-latest
    permissions:
      security-events: write # Required to upload SARIF results
      actions: read
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # 1. Gitleaks: Catch secrets
      - name: Gitleaks Scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # 2. Semgrep: Generate SARIF for GitHub Security Dashboard (informational)
      - name: Semgrep Scan
        uses: semgrep/semgrep-action@v1
        with:
          config: "p/default"
          generateSarif: "1"
        continue-on-error: true # scanning is advisory; never block the build on it

      - name: Upload Semgrep results to GitHub Security
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: semgrep.sarif
        # Only upload if the SARIF was actually produced; otherwise skip rather than fail
        # (the action's output path has historically not matched this name).
        if: always() && hashFiles('semgrep.sarif') != ''

      # 3. Trivy: Generate SARIF for dependency/FS vulnerabilities (informational)
      - name: Trivy Scan
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          ignore-unfixed: true
          format: 'sarif'
          output: 'trivy-results.sarif'
          severity: 'CRITICAL,HIGH'
        continue-on-error: true
        if: always() # run even if Semgrep's upload was skipped

      - name: Upload Trivy results to GitHub Security
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-results.sarif
        if: always() && hashFiles('trivy-results.sarif') != ''
          
      # 4. NPM Audit — the real blocking security gate
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: 'npm'
      # Blocking: only production (runtime) deps are deployed to the edge, so the critical
      # check audits those. Build-time-only advisories (e.g. `tar` under the deprecated
      # @cloudflare/next-on-pages) cannot ship and are reported non-blocking below.
      - name: NPM Audit (production criticals - blocking)
        if: always()
        run: npm audit --omit=dev --audit-level=critical
      - name: NPM Audit (full tree incl. dev toolchain - informational)
        run: npm audit --audit-level=critical
        continue-on-error: true
